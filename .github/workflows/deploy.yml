name: Deploy Bomber Robot Online to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site bundle
        run: |
          mkdir -p _site
          HTML_FILE=$(find . -maxdepth 3 -name "*.html" -not -path "./_site/*" | head -n 1)
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
          elif [ -f "bomber-robot-online.html" ]; then
            cp bomber-robot-online.html _site/index.html
          elif [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" _site/index.html
          else
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
